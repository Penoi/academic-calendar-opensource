{% extends "base.html" %}
{% block title %}Entrar · Calendário{% endblock %}
{% block body %}
<main class="auth-wrap">
  <div class="card auth-card">
    <div class="brand">{% include "partials/logo.html" %}Calendário</div>
    <h1>Entre para ver suas matérias</h1>
    <form action="/login" method="post" hx-post="/login" hx-target="#form-errors">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}" autofocus>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div id="form-errors">{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}</div>
      <button class="btn btn-primary btn-block">Entrar</button>
    </form>
    <p class="auth-foot">Não tem conta? <a href="/register">Criar conta</a></p>
  </div>
</main>
{% endblock %}
